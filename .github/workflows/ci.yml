name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Bounded native fuzzing
        if: matrix.go == '1.27.x'
        shell: bash
        run: |
          for target in Decimal Credentials Origins CursorEncoding Pagination; do
            go test -run '^$' -fuzz "^Fuzz${target}$" -fuzztime 5s -parallel 2 .
          done
      - run: go build ./...
