name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-sdk
      - name: Read pinned Python revision
        id: peer
        run: python3 -c 'import json; print("revision=" + json.load(open("go-sdk/tools/parity-peer.json"))["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: angru/exness-python
          ref: ${{ steps.peer.outputs.revision }}
          path: python-sdk
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: uv sync --locked
        working-directory: python-sdk
      - run: go mod download
        working-directory: go-sdk
      - name: Compare shared fixtures and actual SDK results
        env:
          UV_OFFLINE: "1"
          GOPROXY: "off"
          GOTOOLCHAIN: local
          PEER_REVISION: ${{ steps.peer.outputs.revision }}
        run: >-
          python3 go-sdk/tools/check_parity.py
          --python-root python-sdk --go-root go-sdk
          --peer python --peer-revision "$PEER_REVISION"

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Benchmark correctness smoke (no speed threshold)
        if: matrix.go == '1.26.x'
        run: go test -run '^$' -bench '^(BenchmarkParse|BenchmarkSign)' -benchtime=1x -count=1 -cpu=1 .
      - name: Bounded native fuzzing
        if: matrix.go == '1.27.x'
        shell: bash
        run: |
          for target in Decimal Credentials Origins CursorEncoding Pagination RESTResponses WebSocketMessages DecoderSequences; do
            go test -run '^$' -fuzz "^Fuzz${target}$" -fuzztime 5s -parallel 2 .
          done
      - run: go build ./...
